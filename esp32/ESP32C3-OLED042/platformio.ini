; LiFePO4 BMS Monitor on an ESP32-C3 with a 0.42" OLED.
;
; The device speaks the same HTTP API as the desktop application, serves the
; same interface (ui/ is copied into the filesystem image at build time),
; publishes the same MQTT topics to Home Assistant, reads the battery over
; Bluetooth LE and shows its state on the small OLED.
;
;   pio run                     build the firmware
;   pio run -t upload           flash over USB
;   pio run -t uploadfs         flash the interface (LittleFS)
;   pio run -t upload --upload-port <ip>    flash over the air
;   pio device monitor          serial log

[env:esp32c3]
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.filesystem_size = 0x60000

; The board talks over its own USB port (USB Serial/JTAG), so "Serial" is the
; USB CDC and the monitor works without an extra USB to UART bridge.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    olikraus/U8g2@^2.36.5
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

; Copy ../../ui into data/ before every build, so the device serves exactly
; the same interface as the desktop application.
extra_scripts = pre:sync_ui.py

; Flashing without a cable, over the network:
;
;   pio run -e ota -t upload --upload-port 192.168.1.50
;
; It speaks the protocol of the Arduino IDE on port 3232 (the password is the
; one in the settings, "lifepo4bms" until it is changed). The device keeps the
; running firmware until the new one is complete and switches over after a
; restart, so a failed update cannot brick it.
[env:ota]
extends = env:esp32c3
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=lifepo4bms
